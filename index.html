    return;
  }
  if (e.target.id === 'viewer' || e.target.id === 'viewerImg') { $('viewer').hidden = true; return; }
  if (e.target.id === 'modal') { closeModal(); return; }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const r = S.result;

  switch (act) {
    case 'paste':
      try {
        const t = await navigator.clipboard.readText();
        if (!t) { toast('剪贴板为空', 'err'); break; }
        $('shareUrl').value = t.trim();
        toast('已粘贴', 'ok');
      } catch (_) { toast('浏览器未授权读取剪贴板，请手动粘贴', 'err'); }
      break;

    case 'parse': parseUrl(); break;
    case 'settings': openSettings(); break;
    case 'modal-close': closeModal(); break;
    case 'totop': window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'toggle-desc': S.descExpanded = !S.descExpanded; paint(); break;
    case 'copy-desc': if (r) copyText(r.description || '', '已复制作品文案'); break;

    /* ---- Cookie ---- */
    case 'cookie-edit': S.cookiePanel = S.cookiePanel === 'edit' ? null : 'edit'; paint(); break;
    case 'cookie-view': S.cookiePanel = S.cookiePanel === 'view' ? null : 'view'; paint(); break;
    case 'cookie-help': S.cookiePanel = S.cookiePanel === 'help' ? null : 'help'; paint(); break;
    case 'cookie-cancel': S.cookiePanel = null; paint(); break;
    case 'cookie-copy': copyText(cfg.cookie || ''); break;
    case 'copy-cookiejs': copyText('copy(document.cookie)', '已复制，去 douyin.com 控制台执行'); break;
    case 'cookie-paste':
      try {
        const t = await navigator.clipboard.readText();
        const box = $('manualCookie');
        if (box) box.value = t.trim();
        S.manualCookie = t.trim();
        toast('已读取剪贴板', 'ok');
      } catch (_) { toast('无法读取剪贴板', 'err'); }
      break;
    case 'cookie-save': {
      const box = $('manualCookie');
      const val = (box ? box.value : S.manualCookie || '').trim();
      if (!val) { toast('Cookie 为空', 'err'); break; }
      if (!/sessionid|passport/i.test(val)) toast('提示：缺少 sessionid/passport，可能不是完整登录 Cookie', 'err');
      cfg.cookie = val;
      S.manualCookie = '';
      saveCfg();
      S.cookiePanel = null;
      toast('Cookie 已保存到本机浏览器', 'ok');
      refreshIdentity();
      paint();
      break;
    }
    case 'guest-save': {
      const box = $('guestCookie');
      cfg.guestCookie = (box ? box.value : '').trim();
      saveCfg();
      toast('游客 ttwid 已保存', 'ok');
      refreshIdentity();
      paint();
      break;
    }
    case 'cookie-clear':
      cfg.cookie = '';
      cfg.guestCookie = '';
      saveCfg();
      S.cookiePanel = null;
      S.identity = { state: 'guest', nickname: '' };
      toast('已清除 Cookie', 'ok');
      paint();
      break;
    case 'cookie-validate': {
      const ck = effectiveCookie();
      if (!ck) { toast('还没有 Cookie，请先填写', 'err'); break; }
      toast('正在验证…');
      const res = await DouyinParser.validateCookie(ck);
      toast(res.msg, res.ok ? 'ok' : 'err');
      refreshIdentity();
      break;
    }

    /* ---- 批量 ---- */
    case 'dl-all': if (r) downloadAllItems(r); break;
    case 'save-all': if (r) saveAllItems(r); break;

    /* ---- 评论 ---- */
    case 'comments-toggle':
      if (S.comments.shown) { S.comments.shown = false; paint(); }
      else if (S.comments.list.length) { S.comments.shown = true; paint(); }
      else loadComments(false);
      break;
    case 'comments-more': loadComments(true); break;
    case 'cpage-first': S.comments.page = 0; paint(); break;
    case 'cpage-prev': S.comments.page = Math.max(0, S.comments.page - 1); paint(); break;
    case 'cpage-next': S.comments.page++; paint(); break;
    case 'cpage-last': S.comments.page = 9999; paint(); break;
    case 'reply': loadReplies(el.dataset.cid, el.dataset.aweme); break;
    case 'copy-comment': copyText(el.dataset.text || '', '已复制评论'); break;
    case 'dl-cimg': downloadCommentImage(el.dataset.url); break;
    case 'save-cimg': {
      const m = getMedia('cimg:' + el.dataset.url);
      if (m) saveBlobAs(`douyin_comment_${nowMs()}.${extFromUrl(el.dataset.url)}`, m.blob);
      break;
    }

    /* ---- 视频 / 音频 ---- */
    case 'dl-video': if (r) downloadVideoFile(r); break;
    case 'copy-video-url': if (r) copyText(r.videoUrl || '', '已复制无水印视频直链'); break;
    case 'save-video': {
      const m = getMedia('video');
      if (m) saveBlobAs(`douyin_${(r && r.videoId) || nowMs()}.mp4`, m.blob);
      break;
    }
    case 'dl-track': if (r) downloadAudioTrack(r); break;
    case 'save-track': {
      const m = getMedia('audio');
      if (m) saveBlobAs(S.audio.name || (audioSaveName(r || {}) + '.mp3'), m.blob);
      break;
    }
    case 'dl-mixaudio': {
      if (!r || !r.audioUrl) break;
      S.mixAudio.busy = true; paint();
      try {
        const u = 'https://www.douyin.com/aweme/v1/play/?video_id=' + encodeURIComponent(r.audioUrl) + '&ratio=1080p&line=0';
        const { blob } = await downloadBinary(u, {});
        putMedia('mixaudio', blob);
        toast('音频轨下载完成', 'ok');
      } catch (e) { toast('音频轨下载失败：' + ((e && e.message) || e), 'err'); }
      S.mixAudio.busy = false; paint();
      break;
    }
    case 'save-mixaudio': {
      const m = getMedia('mixaudio');
      if (m) saveBlobAs(`douyin_mixa_${(r && r.videoId) || nowMs()}.mp4`, m.blob);
      break;
    }

    /* ---- 合集 / 实况 ---- */
    case 'fetch-mix': if (r) fetchMix(r.videoId); break;
    case 'dl-mix-all': {
      if (!S.mix.videos.length) break;
      const b = S.mix.batch;
      b.running = true; b.done = 0; b.idx = -1;
      paint();
      for (let i = 0; i < S.mix.videos.length; i++) {
        b.idx = i;
        b.text = `${b.done + 1}/${S.mix.videos.length}`;
        paint();
        const mv = S.mix.videos[i];
        if (!mv.videoUrl) continue;
        try {
          const { blob } = await downloadBinary(mv.videoUrl, {});
          putMedia('mix' + i, blob);
          b.done++;
        } catch (e) { logLine('合集批量失败 #' + (i + 1) + ': ' + ((e && e.message) || e)); }
      }
      b.running = false;
      b.idx = -1;
      b.text = '';
      toast(b.done === S.mix.videos.length
        ? `全部下载完成（${b.done} 个），可逐个保存`
        : `下载完成：${b.done}/${S.mix.videos.length} 个成功`, b.done === S.mix.videos.length ? 'ok' : 'err');
      paint();
      break;
    }
    case 'dl-mix-item': {
      const i = parseInt(el.dataset.i, 10);
      const mv = S.mix.videos[i];
      if (!mv) break;
      S.mix.dlIdx = i; paint();
      try {
        const { blob } = await downloadBinary(mv.videoUrl, {});
        putMedia('mix' + i, blob);
      } catch (e) { toast('视频下载失败：' + ((e && e.message) || e), 'err'); }
      S.mix.dlIdx = -1; paint();
      break;
    }
    case 'save-mix-item': {
      const i = parseInt(el.dataset.i, 10);
      const m = getMedia('mix' + i);
      const mv = S.mix.videos[i] || {};
      if (m) saveBlobAs(`douyin_${mv.awemeId || ((r && r.videoId) + '_' + (i + 1))}.mp4`, m.blob);
      break;
    }

    /* ---- 图片 ---- */
    case 'dl-img': downloadImageAt(parseInt(el.dataset.i, 10)); break;
    case 'save-img': {
      const i = parseInt(el.dataset.i, 10);
      const m = getMedia('img' + i);
      const u = r && r.imageUrls[i];
      if (m) saveBlobAs(`douyin_${(r && r.videoId) || nowMs()}_${String(i + 1).padStart(2, '0')}.${extFromUrl(u)}`, m.blob);
      break;
    }
    case 'dl-all-images': downloadAllImages(); break;

    /* ---- 设置 ---- */
    case 'cfg-save':
      collectSettings();
      saveCfg();
      toast('已保存设置', 'ok');
      await probeEdge();
      refreshIdentity();
      paint();
      break;
    case 'cfg-test': collectSettings(); runChannelTest(); break;
    case 'cfg-reset':
      try { localStorage.removeItem(LS_KEY); } catch (_) {}
      toast('已清空，正在刷新…', 'ok');
      setTimeout(() => location.reload(), 500);
      break;
    case 'copy-rule': copyText(EDGE_RULE_TEXT, '已复制回源规则说明'); break;
    case 'copy-logs': copyText(logs.join('\n') || '（暂无日志）', '已复制日志'); break;
  }
});

(function init() {
  loadCfg();
  paintHeader();
  paintCookiePanel();
  renderResult();
  updateChannelChip();
  logLine('页面已加载，通道=' + cfg.channel);
  probeEdge().then(() => {
    if (edgeOk === false) logLine('未检测到本站反代（/dyapi），将使用直连 + 公共代理');
  });
  refreshIdentity();
  // 支持用 #ck=xxx 或 ?ck=xxx 快速导入 Cookie（不写入服务器，仅本机）
  try {
    const hash = location.hash || '';
    const m = /[#?&]ck=([^&]+)/.exec(hash);
    if (m) {
      cfg.cookie = decodeURIComponent(m[1]);
      saveCfg();
      history.replaceState(null, '', location.pathname + location.search);
      refreshIdentity();
    }
  } catch (_) {}
})();
</script>
